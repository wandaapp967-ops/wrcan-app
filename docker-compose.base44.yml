# Base44 development environment for the WRCAN / Talent Connect Hub app.
#
# The app is a TanStack Start (React 19 + Vite) SSR front end. Its data, auth and
# storage layer is hosted Supabase — there is NO local database to run, and no
# external credential is required to boot:
#   * `SUPABASE_URL` / `SUPABASE_PUBLISHABLE_KEY` already ship in the repo's
#     committed `.env` (the publishable key is a public, client-side key).
#   * `SUPABASE_SERVICE_ROLE_KEY` is only read by the lazily-created
#     `supabaseAdmin` proxy in src/integrations/supabase/client.server.ts, which
#     nothing imports, so an empty value never blocks startup.
#
# Run with:  docker compose -f docker-compose.base44.yml up -d --build
name: wrcan-app

services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    # Dependencies live in the named volume below, so install from the pinned
    # bun lockfile on startup (after the bind mount is in place), then run Vite's
    # dev server for live reload.
    command:
      - sh
      - -ec
      - |
        npm install --global bun@1 >/dev/null 2>&1
        bun install --frozen-lockfile
        exec node ./node_modules/vite/bin/vite.js dev --host 0.0.0.0 --port 3000 --strictPort
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
    # The repo's own committed env file (public Supabase URL + publishable key).
    env_file:
      - ./.env
    environment:
      # Passed through from the platform; absent/empty in normal runs, and the
      # app only branches on an exact "1".
      - BASE44_PREVIEW_MODE
      # Set by the platform so Vite appends the preview host to server.allowedHosts.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      # The project's own published Lovable host. `@lovable.dev/vite-tanstack-config`
      # proxies `/__l5e/assets-v1/*` (the wanda-logo.png.asset.json asset) to this host,
      # but the proxy is a no-op unless LOVABLE_PREVIEW_HOST is set.
      - LOVABLE_PREVIEW_HOST=wrcan-app.lovable.app
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    restart: on-failure

volumes:
  web_node_modules:
